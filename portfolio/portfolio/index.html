  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <div class="top-inner">
      <a class="mark" href="#top">Anirudh C.</a>
      <nav aria-label="Primary" id="nav">
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#playground">Try it</a>
        <a href="#skills">Skills</a>
        <a href="#beyond">Beyond the desk</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme" id="themeBtn" type="button" aria-label="Switch color theme">Theme</button>
    </div>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero-copy">
        <p class="status" id="status"></p>
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
        <p class="headline" id="headline"></p>
        <p class="summary" id="summary"></p>
        <div class="actions" id="heroActions"></div>
      </div>
      <div>
        <div class="cluster" id="cluster"></div>
        <p class="hint">Tap any dial to see how I got there.</p>
      </div>
    </section>

    <section class="lens" id="lens" aria-labelledby="h-lens">
      <h2 class="lens-h" id="h-lens">What are you hiring for?</h2>
      <div class="lens-row" id="lensRow" role="group" aria-label="Hiring focus"></div>
      <p class="lens-pitch" id="lensPitch" aria-live="polite"></p>
    </section>

    <section id="experience" aria-labelledby="h-exp">
      <h2 id="h-exp">Experience</h2>
      <div class="timeline" id="expList"></div>
    </section>

    <section id="projects" aria-labelledby="h-proj">
      <h2 id="h-proj">Projects</h2>
      <div class="projects" id="projList"></div>
    </section>

    <section id="playground" aria-labelledby="h-play">
      <h2 id="h-play">Try it</h2>
      <div class="tabs" role="tablist" aria-label="Interactive demos">
        <button role="tab" id="tab-var" aria-controls="panel-var" aria-selected="true" type="button">Budget vs. actuals</button>
        <button role="tab" id="tab-mc" aria-controls="panel-mc" aria-selected="false" tabindex="-1" type="button">Monte Carlo planner</button>
      </div>
      <div class="panel" id="panel-var" role="tabpanel" aria-labelledby="tab-var"></div>
      <div class="panel" id="panel-mc" role="tabpanel" aria-labelledby="tab-mc" hidden></div>
    </section>

    <section id="skills" aria-labelledby="h-skills">
      <h2 id="h-skills">Skills</h2>
      <div class="skills" id="skillList"></div>
    </section>

    <section id="education" aria-labelledby="h-edu">
      <h2 id="h-edu">Education</h2>
      <div class="edu" id="eduList"></div>
    </section>

    <section id="beyond" aria-labelledby="h-beyond">
      <h2 id="h-beyond">Beyond the desk</h2>
      <div class="beyond" id="beyondList"></div>
    </section>

    <section id="contact" aria-labelledby="h-contact">
      <h2 id="h-contact">Contact</h2>
      <div class="contact" id="contactBox"></div>
    </section>
  </main>

  <footer>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
    <p id="footText"></p>
  </footer>

  <!-- Story card opened from the dials -->
  <dialog id="story" aria-labelledby="storyTitle">
    <div class="story-body" id="storyBody"></div>
  </dialog>

  <!-- Scroll gauge: shows how far down the page you are -->
  <button class="tach" id="tach" type="button" aria-label="Back to top">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path id="tachTrack" class="t-track" fill="none" stroke-width="8" stroke-linecap="round"/>
      <path id="tachVal" class="t-val" fill="none" stroke-width="8" stroke-linecap="round" pathLength="1"/>
      <g id="tachNeedle" class="t-needle"><polygon points="48.6,52 51.4,52 50.6,20 49.4,20" fill="#D3202F"/></g>
      <circle cx="50" cy="50" r="6" fill="#1d1f22" stroke="#555a61" stroke-width="1.5"/>
      <text id="tachGear" x="50" y="82" class="t-gear">1</text>
